[package]
name = "font-awl"
version = "0.2.6"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Cross-platform font provider for Rust, wrapping fontique + parley"
repository = "https://github.com/mlm-games/font-awl"
readme = "README.md"
# crates.io rejects uploads over 10 MiB and NotoSansCJK-Regular.ttc alone is
# ~19 MiB. Consumers wanting it should register their
# own copy via the font-data API.
exclude = ["fonts/NotoSansCJK-Regular.ttc"]

[features]
default = ["std", "parley", "fontconfig-dlopen"]
std = ["fontique/std", "parley?/std"]
system = ["std", "fontique/system", "parley?/system", "dep:libloading"]
parley = ["dep:parley"]
fontconfig-dlopen = ["fontique/fontconfig-dlopen"]
basic = []
emoji = []
cjk = []
monospace = []
all-noto = ["basic", "emoji", "cjk"]
local-fonts = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys", "dep:web-sys"]

[dependencies]
fontique = { version = "0.11", default-features = false, features = ["std"] }
log = "0.4"
parley = { version = "0.11", optional = true, default-features = false, features = [
    "std",
] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Document",
    "Window",
    "FontData",
    "Blob",
] }

[target.'cfg(target_os = "android")'.dependencies]
libloading = { version = "0.9", optional = true }

[package.metadata.docs.rs]
features = ["parley", "basic", "emoji", "system"]
rustdoc-args = ["--cfg", "docsrs"]
