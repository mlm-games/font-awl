name: Release crate

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  publish:
    uses: mlm-games/ci/.github/workflows/crate-publish.yml@main
    permissions:
      contents: write
    with:
      write-android-version-code: false
      create-release: ${{ inputs.create_release != false }}
      generate-release-notes: true
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}